server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    active: git

  cloud:
    config:
      server:
        # used when you want to use a local directory as a config source 'dev mode'
        native:
          search-locations: file:../config-repo

        # used when you want to use a git repository as a config source 'prod mode'
        git:
          uri: https://github.com/Chouich-Nacereddine/SoftPos.git
          default-label: v.0.0.1
          search-paths:
            - infra/config-repo
          clone-on-start: true
